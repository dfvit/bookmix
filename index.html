<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1620">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<title>Bookmix – a playlist for your book</title>
<style>
:root{--bg:#e9eef2;--card:#fff;--ink:#14202b;--mute:#5a6874;--line:#d3dbe2;--acc:#7a4f00;--accbg:#f3e4bd;--btn:#14202b;--btnink:#fff;--glow:rgba(227,187,85,.3);--shadow:0 1px 2px rgba(20,32,43,.06),0 10px 28px rgba(20,32,43,.08);--serif:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d1620;--card:#16222d;--ink:#ece7db;--mute:#93a2b0;--line:#27384a;--acc:#e3bb55;--accbg:#352f1c;--btn:#e3bb55;--btnink:#14202b;--glow:rgba(227,187,85,.1);--shadow:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(900px 520px at 88% -8%,var(--glow),transparent 62%) no-repeat;color:var(--ink);font:16px/1.55 var(--sans);counter-reset:step}
main{max-width:640px;margin:0 auto;padding:36px 18px 90px}
header{display:flex;align-items:center;gap:16px}
.disc{flex:none;width:62px;height:62px;border-radius:50%;box-shadow:var(--shadow);animation:spin 16s linear infinite;
 background:radial-gradient(circle,var(--acc) 0 11%,#0b0b0b 12% 15%,transparent 16%),conic-gradient(rgba(255,255,255,.14),transparent 22%,rgba(255,255,255,.14) 50%,transparent 72%,rgba(255,255,255,.14)),repeating-radial-gradient(circle,#161616 0 2px,#262626 2px 4px)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:2.7rem;line-height:1}
h2{font-size:1.4rem;line-height:1.2;margin-bottom:6px}
.sub{color:var(--mute);margin:10px 0 28px;font-size:1.05rem}
section{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
section:not(.plain){counter-increment:step}
section:not(.plain)::before{content:"Step " counter(step);display:block;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
input[type=checkbox]{width:auto;margin:0 10px 0 0;accent-color:var(--acc)}
label{font-size:.88rem;color:var(--mute);display:block;margin-bottom:5px}
.chk{display:flex;align-items:center;color:var(--ink);margin-bottom:14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;background:var(--btn);color:var(--btnink);cursor:pointer;transition:filter .15s,transform .1s,border-color .15s}
button:hover{filter:brightness(1.08)}button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--acc);filter:none}
button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pick{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-weight:400}
.pick:hover{border-color:var(--acc);filter:none}
.pick img,.cover{width:46px;height:68px;object-fit:cover;border-radius:4px;background:var(--line);flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cover{width:56px;height:84px}
.pick b{display:block;font-family:var(--serif);font-weight:600}.pick span{color:var(--mute);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}
.chip{background:var(--accbg);color:var(--acc);border-radius:99px;padding:4px 6px 4px 13px;font-size:.86rem;font-weight:600}
.chip button{background:none;color:inherit;padding:0 6px;font-size:1.05rem;border-radius:99px}
#mood{font-family:var(--serif);font-style:italic;color:var(--mute);border-left:3px solid var(--acc);padding-left:12px;margin:8px 0 4px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-size:1.08rem;color:var(--acc);margin:24px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec button{font-size:.78rem;padding:4px 12px;font-family:var(--sans);font-style:normal;border-radius:99px}
#songs{counter-reset:t}
.song{counter-increment:t;display:flex;align-items:center;gap:10px;padding:10px 6px;border-radius:10px}
.song:hover{background:var(--bg)}
.song::before{content:counter(t,decimal-leading-zero);font:.78rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc);width:24px;flex:none}
.song>div{flex:1;font-weight:600}
.song small{display:block;color:var(--mute);font-weight:400}
.song button{background:none;color:var(--mute);padding:0 8px;font-size:1.1rem}
.msg{color:var(--mute);margin:10px 0 0}.err{color:#c0392b}
details summary{cursor:pointer;font-weight:600}
.hint{font-size:.85rem;color:var(--mute)}
code{background:var(--bg);padding:2px 6px;border-radius:5px;font-size:.82rem;word-break:break-all}
[hidden]{display:none!important}
@media (max-width:480px){h1{font-size:2.2rem}.disc{width:50px;height:50px}main{padding-top:26px}}
</style>
</head>
<body>
<main>
<header><div class="disc" aria-hidden="true"></div><h1>Bookmix</h1></header>
<p class="sub">Tell it what you're reading. Get a playlist that fits the story.</p>

<section>
  <label for="q">Book title (and author, if you like)</label>
  <div class="row"><input id="q" placeholder="e.g. Dune Frank Herbert" style="flex:1;margin:0"><button id="go">Find book</button></div>
  <div id="results" style="margin-top:12px"></div>
  <div id="status" class="msg" role="status"></div>
</section>

<section id="bookbox" hidden>
  <div class="row" style="flex-wrap:nowrap;align-items:flex-start">
    <img id="cover" class="cover" alt="">
    <div><h2 id="bt"></h2><div id="ba" class="hint"></div></div>
  </div>
  <label style="margin-top:12px">Themes (remove or add to steer the playlist)</label>
  <div id="chips" class="chips"></div>
  <div class="row"><input id="newtheme" placeholder="Add a theme" style="flex:1;margin:0"><button class="ghost" id="addtheme">Add</button></div>
  <label for="upto" style="margin-top:12px">How far have you read? (optional, avoids spoilers)</label>
  <input id="upto" placeholder="e.g. Chapter 12, or halfway">
  <label for="len">Playlist length</label>
  <select id="len"><option value="20">Short – 20 songs (~1.5 hrs)</option><option value="40" selected>Standard – 40 songs (~3 hrs)</option><option value="60">Long – 60 songs (~4.5 hrs)</option></select>
  <label class="chk"><input type="checkbox" id="inst" checked>Favor songs that are easy to read to (calm, instrumental, few lyrics)</label>
  <button id="gen">Make my playlist</button>
</section>

<section id="plbox" hidden>
  <h2>Your playlist</h2>
  <div id="mood" class="hint"></div>
  <div id="songs"></div>
  <div class="row" style="margin-top:14px">
    <button id="exp">Save to Spotify</button>
    <button class="ghost" id="copy">Copy as text</button>
  </div>
  <div id="expstatus" class="msg" role="status"></div>
</section>

<section class="plain">
<details>
  <summary>Settings</summary>
  <p class="hint">Bookmix works without any keys. Everything here is optional and stored only in this browser.</p>
  <label for="akey">Anthropic API key (optional, for higher-quality picks)</label>
  <input id="akey" type="password" placeholder="sk-ant-...">
  <div id="cidbox">
    <label for="cid">Spotify Client ID (only if the site owner hasn't set one)</label>
    <input id="cid" placeholder="Client ID from developer.spotify.com">
    <p class="hint">Spotify redirect URI to register: <code id="ruri"></code></p>
  </div>
  <button class="ghost" id="save">Save settings</button>
</details>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
// Paste YOUR Spotify Client ID between the quotes so visitors need no setup. It is public by design, not a secret.
const SPOTIFY_CLIENT_ID='';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
const REDIRECT=location.origin+location.pathname;
let book=null,themes=[],songs=[],mood='',token=sessionStorage.getItem('tok')||'';

$('ruri').textContent=REDIRECT;
if(SPOTIFY_CLIENT_ID)$('cidbox').hidden=true;
$('akey').value=ls('akey');$('cid').value=ls('cid');
$('save').onclick=()=>{ls('akey',$('akey').value.trim());ls('cid',$('cid').value.trim());$('save').textContent='Saved';setTimeout(()=>$('save').textContent='Save settings',1500)};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('go').onclick=search;

const status=(t,err)=>{$('status').textContent=t;$('status').className='msg'+(err?' err':'')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function search(){
  const q=$('q').value.trim(); if(!q)return;
  status('Searching…'); $('results').innerHTML='';
  try{
    let items=[];
    try{
      const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=5&printType=books&q='+encodeURIComponent(q));
      if(r.ok){
        const j=await r.json();
        items=(j.items||[]).map(i=>{const v=i.volumeInfo;return{
          title:v.title+(v.subtitle?': '+v.subtitle:''),
          author:(v.authors||[]).join(', '),
          cats:v.categories||[],desc:v.description||'',
          thumb:((v.imageLinks||{}).thumbnail||'').replace('http:','https:')}});
      }
    }catch(e){}
    if(!items.length){
      const r=await fetch('https://openlibrary.org/search.json?limit=5&fields=title,author_name,subject,cover_i&q='+encodeURIComponent(q));
      const j=await r.json();
      items=(j.docs||[]).map(d=>({title:d.title,author:(d.author_name||[]).slice(0,2).join(', '),
        cats:(d.subject||[]).filter(x=>x.length<28).slice(0,4),desc:'',
        thumb:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':''}));
    }
    if(!items.length){status('No books found. Try the title plus the author’s name.',true);return}
    status('Pick your book:');
    items.forEach(b=>{
      const el=document.createElement('button');el.className='pick';
      el.innerHTML=`<img src="${esc(b.thumb)}" alt=""><div><b>${esc(b.title)}</b><span>${esc(b.author)}</span></div>`;
      el.onclick=()=>pick(b);$('results').appendChild(el);
    });
  }catch(e){status('Book search failed. Check your connection and try again.',true)}
}

async function pick(b){
  book=b;$('results').innerHTML='';status('Looking up themes…');
  let subs=[];
  try{
    const u='https://openlibrary.org/search.json?limit=1&fields=subject&title='+encodeURIComponent(b.title.split(':')[0])+'&author='+encodeURIComponent(b.author.split(',')[0]);
    const j=await (await fetch(u)).json();
    subs=((j.docs[0]||{}).subject||[]).filter(s=>s.length<28&&!/\d|fiction$|^reading|^large print|^open library/i.test(s));
  }catch(e){}
  const all=[...b.cats,...subs].map(s=>s.toLowerCase().trim());
  themes=[...new Set(all)].slice(0,8);
  $('bt').textContent=b.title;$('ba').textContent='by '+b.author;
  $('cover').src=b.thumb;renderChips();
  $('bookbox').hidden=false;$('plbox').hidden=true;status('');
  $('bookbox').scrollIntoView({behavior:'smooth'});
}

function renderChips(){
  $('chips').innerHTML='';
  themes.forEach((t,i)=>{
    const c=document.createElement('span');c.className='chip';
    c.innerHTML=esc(t)+'<button aria-label="Remove '+esc(t)+'">×</button>';
    c.querySelector('button').onclick=()=>{themes.splice(i,1);renderChips()};
    $('chips').appendChild(c);
  });
}
$('addtheme').onclick=()=>{const v=$('newtheme').value.trim().toLowerCase();if(v){themes.push(v);$('newtheme').value='';renderChips()}};

$('gen').onclick=generate;
async function callAI(prompt,max){
  const key=ls('akey');
  if(key){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:max,messages:[{role:'user',content:prompt}]})});
    if(!r.ok)throw new Error('Anthropic API error '+r.status);
    return (await r.json()).content.map(c=>c.text||'').join('');
  }
  return freeAI(prompt);
}
async function freeAI(prompt){
  const msgs=[{role:'system',content:'You are a music curator. Reply with valid JSON only. Do not explain.'},{role:'user',content:prompt}];
  let last='no response';
  for(const model of ['openai-fast','mistral','openai']){
    for(let a=0;a<2;a++){
      let r;
      try{r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model,messages:msgs,max_tokens:6000})})}
      catch(e){last='could not reach the free AI';break}
      if(r.status===429&&a===0){status('The free AI is busy. Retrying in a few seconds…');await new Promise(z=>setTimeout(z,16000));continue}
      const raw=await r.text();
      if(!r.ok){last='free AI unavailable ('+r.status+')';break}
      let out='';
      try{const j=JSON.parse(raw);const m=j.choices&&j.choices[0]&&j.choices[0].message;out=(m&&m.content)||j.content||(j.songs?raw:'')}
      catch(e){out=raw}
      if(out&&out.indexOf('"songs"')>-1)return out;
      last='unexpected reply from the free AI ('+model+'): '+raw.slice(0,80);break;
    }
  }
  throw new Error(last);
}
const parseJSON=t=>{t=String(t||'');const i=t.indexOf('{'),k=t.lastIndexOf('}');if(i<0||k<i)throw new Error('the AI reply was not a playlist');return JSON.parse(t.slice(i,k+1))};

async function generate(){
  $('gen').disabled=true;
  const n=+$('len').value,inst=$('inst').checked,intro=Math.round(n*0.15);
  const prompt=`Book: "${book.title}" by ${book.author}.
Genres/themes: ${themes.join(', ')||'unknown'}.
Description: ${book.desc.slice(0,900)}
Reader's progress: ${$('upto').value||'not given'} (no spoilers past this point).

Build a ${n}-song playlist. Return ONLY JSON, no markdown:
{"mood":"one sentence on the book's overall sound","themes":["up to 6 central themes"],"songs":[{"title":"","artist":"","section":"","why":"max 12 words"}]}
Rules: the first ${intro} songs have section "Overall vibe". The rest follow the book in reading order, 2-4 songs per section, building with the story's emotional arc (tension rises toward the climax, then releases), where section is the real chapter or part name if you know it, otherwise a story stage like "Opening", "Rising tension", "Turning point". Only include real, well-known songs that exist on Spotify; never invent titles.${inst?' Mostly choose songs that are easy to read to: calm, instrumental or sparse lyrics. Allow a few lyric-driven songs only for key moments.':''} No duplicate songs.`;
  try{
    status('Building your playlist… this can take up to a minute.');
    const d=parseJSON(await callAI(prompt,8000));
    if(!Array.isArray(d.songs)||!d.songs.length)throw new Error('empty answer');
    songs=d.songs;mood=d.mood||'';
    if(d.themes&&d.themes.length){themes=d.themes.map(t=>String(t).toLowerCase());renderChips()}
    status('');renderSongs();
  }catch(e){
    try{
      if(!token){status('The AI step failed ('+e.message+'). Switching to theme search on Spotify…',true);await login('generate');$('gen').disabled=false;return}
      status('The AI step failed ('+e.message+'). Using theme search on Spotify instead.',true);
      songs=[];mood='Theme-based picks. Try again later for chapter-by-chapter choices.';
      for(const t of themes.slice(0,8)){
        const d=await sp('/search?type=track&limit=3&q='+encodeURIComponent(t));
        d.tracks.items.forEach(x=>songs.push({title:x.name,artist:x.artists[0].name,section:t,why:'',uri:x.uri}));
      }
      renderSongs();
    }catch(e2){status('Could not build the playlist: '+e2.message,true)}
  }
  $('gen').disabled=false;
}

function renderSongs(keep){
  $('mood').textContent=mood;$('songs').innerHTML='';
  let last=null;
  songs.forEach((s,i)=>{
    if(s.section!==last){const h=document.createElement('div');h.className='sec';const sec=s.section;
      h.innerHTML='<span>'+esc(sec)+'</span><button class="ghost">Redo</button>';
      h.querySelector('button').onclick=e=>regen(sec,e.target);
      $('songs').appendChild(h);last=s.section}
    const d=document.createElement('div');d.className='song';
    d.innerHTML=`<div>${esc(s.title)} <small>${esc(s.artist)}${s.why?' · '+esc(s.why):''}</small></div><button aria-label="Remove song">×</button>`;
    d.querySelector('button').onclick=()=>{songs.splice(i,1);renderSongs()};
    $('songs').appendChild(d);
  });
  $('plbox').hidden=false;if(!keep)$('plbox').scrollIntoView({behavior:'smooth'});
}

$('copy').onclick=async()=>{
  const t=`${book.title} – playlist\n`+songs.map(s=>`${s.title} – ${s.artist}`).join('\n');
  try{await navigator.clipboard.writeText(t);$('expstatus').textContent='Copied.'}catch(e){$('expstatus').textContent='Copy failed.'}
};

async function regen(section,btn){
  const out=$('expstatus');out.className='msg';
  const count=songs.filter(s=>s.section===section).length||3;
  const others=songs.filter(s=>s.section!==section).map(s=>s.title+' – '+s.artist).join('; ');
  const old=btn.textContent;btn.disabled=true;btn.textContent='…';
  try{
    const prompt=`Book: "${book.title}" by ${book.author}. Themes: ${themes.join(', ')}. Reader's progress: ${$('upto').value||'not given'} (no spoilers past it).
Suggest ${count} NEW songs for this part of the book: "${section}". Different from the existing playlist: ${others}.
${$('inst').checked?'Prefer calm, instrumental or sparse-lyric songs that are easy to read to.':''}
Return ONLY JSON: {"songs":[{"title":"","artist":"","why":"max 12 words"}]}. Only real, well-known songs on Spotify.`;
    const arr=parseJSON(await callAI(prompt,1500)).songs;
    const idx=songs.findIndex(s=>s.section===section);
    songs=songs.filter(s=>s.section!==section);
    songs.splice(idx,0,...arr.map(x=>({...x,section})));
    renderSongs(true);
  }catch(e){btn.disabled=false;btn.textContent=old;out.textContent='Could not redo that section: '+e.message;out.className='msg err'}
}

/* ---------- Spotify (PKCE, no server needed) ---------- */
const rand=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b%62]).join('');
async function login(action){
  const cid=SPOTIFY_CLIENT_ID||ls('cid')||$('cid').value.trim();
  if(!cid){$('expstatus').textContent='Add your Spotify Client ID in Settings first.';$('expstatus').className='msg err';return}
  ls('cid',cid);
  const v=rand(64);sessionStorage.setItem('v',v);
  sessionStorage.setItem('pending',JSON.stringify({book,themes,songs,mood,action,upto:$('upto').value}));
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const c=btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:REDIRECT,scope:'playlist-modify-private playlist-modify-public',code_challenge_method:'S256',code_challenge:c});
}
async function sp(path,opt={}){
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});
  if(r.status===401){token='';sessionStorage.removeItem('tok');throw new Error('Spotify session expired. Tap the button again to reconnect.')}
  if(!r.ok)throw new Error('Spotify '+r.status+': '+(await r.text()).slice(0,120));
  return r.status===204?{}:r.json();
}
async function callback(){
  const code=new URLSearchParams(location.search).get('code');
  if(!code)return;
  history.replaceState({},'',REDIRECT);
  try{
    const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({client_id:SPOTIFY_CLIENT_ID||ls('cid'),grant_type:'authorization_code',code,redirect_uri:REDIRECT,code_verifier:sessionStorage.getItem('v')})});
    const j=await r.json();if(!j.access_token)throw new Error('no token');
    token=j.access_token;sessionStorage.setItem('tok',token);
    const p=JSON.parse(sessionStorage.getItem('pending')||'null');
    if(p){book=p.book;themes=p.themes;songs=p.songs;mood=p.mood;$('upto').value=p.upto||'';
      if(book){$('bt').textContent=book.title;$('ba').textContent='by '+book.author;$('cover').src=book.thumb;renderChips();$('bookbox').hidden=false}
      if(songs.length)renderSongs();
      if(p.action==='export')exportPl();else if(p.action==='generate')generate();}
  }catch(e){status('Spotify sign-in failed. Check your Client ID and redirect URI.',true)}
}

$('exp').onclick=exportPl;
async function exportPl(){
  const out=$('expstatus');out.className='msg';
  if(!token){await login('export');return}
  $('exp').disabled=true;
  try{
    const uris=[];let miss=0;
    for(let i=0;i<songs.length;i++){
      const s=songs[i];out.textContent=`Matching songs on Spotify… ${i+1}/${songs.length}`;
      if(s.uri){uris.push(s.uri);continue}
      let d=await sp('/search?type=track&limit=1&q='+encodeURIComponent(`track:${s.title} artist:${s.artist}`));
      if(!d.tracks.items.length)d=await sp('/search?type=track&limit=1&q='+encodeURIComponent(`${s.title} ${s.artist}`));
      if(d.tracks.items.length)uris.push(d.tracks.items[0].uri);else miss++;
    }
    out.textContent='Creating playlist…';
    const pl=await sp('/me/playlists',{method:'POST',body:JSON.stringify({name:`${book.title} – Bookmix`,description:`Playlist for "${book.title}" by ${book.author}. ${mood}`.slice(0,300),public:false})});
    for(let i=0;i<uris.length;i+=100){
      const body=JSON.stringify({uris:uris.slice(i,i+100)});
      try{await sp(`/playlists/${pl.id}/items`,{method:'POST',body})}
      catch(e){await sp(`/playlists/${pl.id}/tracks`,{method:'POST',body})}
    }
    out.innerHTML=`Saved ${uris.length} songs${miss?` (${miss} not found)`:''}. <a href="${esc(pl.external_urls.spotify)}" target="_blank" rel="noopener">Open in Spotify</a>`;
  }catch(e){out.textContent=e.message;out.className='msg err'}
  $('exp').disabled=false;
}
callback();
</script>
</body>
</html>
